<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – Mario Zamudio</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="header-placeholder"></div>
  <main>

    <section id="contact" class="contact-section">
      <h2>Contact</h2>
      <div class="qr-contact-list">
        <div class="qr-contact-item">
          <img src="/images/qr-email.png" alt="Email QR">
          <a href="mailto:mzamudio@gmail.com">mzamudio@gmail.com</a>
        </div>
        <div class="qr-contact-item">
          <img src="/images/qr-linkedin.png" alt="LinkedIn QR">
          <a href="https://linkedin.com/in/mzamudio" target="_blank">LinkedIn</a>
        </div>
        <div class="qr-contact-item">
          <img src="/images/qr-indeed.png" alt="Indeed QR">
          <a href="https://profile.indeed.com/p/wg2i33u" target="_blank">Indeed</a>
        </div>
        <div class="qr-contact-item">
          <img src="/images/qr-github.png" alt="GitHub QR">
          <a href="https://github.com/mfzamudio" target="_blank">GitHub</a>
        </div>
      </div>
    </section>

  </main>
  <div id="footer-placeholder"></div>
  <script src="/scripts/include-layout.js"></script>
</body>
</html>
